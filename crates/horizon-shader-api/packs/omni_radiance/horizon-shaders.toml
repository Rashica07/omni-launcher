schema = 1
id = "omni_radiance"
name = "OMNI Radiance"
version = "0.2.0"
api = "0.2"
description = "Vanilla light with soft sun shadows, a deeper sky, thunderstorm lightning, water that mirrors the world, soft bloom and a clean grade. Built on OMNI Glow."
authors = ["OMNI"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "OMNI sky, clouds and lightning"
clouds = false
sun = false

[material]
file = "material.wgsl"
name = "Shadows, lights, water"

[weather]
file = "weather.wgsl"

[shadow]
resolution = 2048
distance = 96.0
option = "shadows"

[reflection]
option = "reflections"

[[post]]
file = "post/rays.wgsl"
name = "God rays and occlusion"
output = "rays"
scale = 0.5

[[post]]
file = "post/light.wgsl"
name = "Apply rays and occlusion"

[[post]]
file = "post/bloom.wgsl"
name = "Soft bloom"

[[post]]
file = "post/grade.wgsl"
name = "OMNI grade"

[[options]]
id = "godrays"
name = "Light shafts"
type = "float"
default = 0.8
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "ambient_occlusion"
name = "Ambient occlusion"
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "shadows"
name = "Sun shadows"
type = "bool"
default = true

[[options]]
id = "shadow_strength"
name = "Shadow strength"
type = "float"
default = 0.85
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "reflections"
name = "Water reflections"
type = "bool"
default = true

[[options]]
id = "cloud_amount"
name = "Clouds"
type = "float"
default = 0.55
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "sky_depth"
name = "Sky depth"
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "bloom"
name = "Bloom"
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "vibrance"
name = "Vibrance"
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "warmth"
name = "Warm highlights"
type = "float"
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "water_shine"
name = "Water shine"
type = "float"
default = 0.8
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "lightning"
name = "Lightning"
type = "bool"
default = true

[[options]]
id = "vignette"
name = "Vignette"
type = "bool"
default = true

# Colour of the light from blocks and held items (a warm torch, cool sea lanterns, ...), after Vivid Horizon (MIT).
[[lights]]
color = [1.0, 0.55, 0.22]
blocks = ["torch", "wall_torch", "campfire", "fire", "jack_o_lantern", "furnace", "smoker", "blast_furnace"]

[[lights]]
color = [1.0, 0.7, 0.38]
blocks = ["lantern", "glowstone", "shroomlight", "*_candle", "candle", "redstone_lamp"]

[[lights]]
color = [0.75, 0.92, 1.0]
blocks = ["sea_lantern", "end_rod", "beacon", "conduit"]

[[lights]]
color = [1.0, 0.82, 0.4]
blocks = ["ochre_froglight"]

[[lights]]
color = [0.6, 1.0, 0.55]
blocks = ["verdant_froglight"]

[[lights]]
color = [1.0, 0.62, 0.92]
blocks = ["pearlescent_froglight"]

[[lights]]
color = [0.3, 0.75, 1.0]
blocks = ["soul_*"]

[[lights]]
color = [1.0, 0.2, 0.1]
blocks = ["redstone_torch", "redstone_wall_torch", "redstone_ore", "deepslate_redstone_ore"]

[[lights]]
color = [1.0, 0.45, 0.1]
blocks = ["lava", "magma_block"]

[budget]
gpu_ms = 0.9
